name: Daily dark jokes

on:
  schedule:
    # 09:00 UTC every day. Adjust the cron if you want a different hour.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, filter, and append jokes
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_jokes.py
